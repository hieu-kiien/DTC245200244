# Hệ thống Quản lý Cửa hàng Thú cưng – Docker Compose
name: petshop

services:
  db:
    image: postgres:16-alpine
    container_name: petshop-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD}
      APP_DB_USER: ${DB_USER}
      APP_DB_PASSWORD: ${DB_PASSWORD}
      MONITOR_DB_USER: ${MONITOR_DB_USER}
      MONITOR_DB_PASSWORD: ${MONITOR_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/00-create-roles.sh:/docker-entrypoint-initdb.d/00-create-roles.sh:ro
      - ./db/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - ./db/20-grant-roles.sh:/docker-entrypoint-initdb.d/20-grant-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]

  webapp:
    build: ./app
    container_name: petshop-webapp
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      db: { condition: service_healthy }
    networks: [frontend, backend, monitoring]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: petshop-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "True"
    ports: ["127.0.0.1:5050:80"]
    volumes: [pgadmin:/var/lib/pgadmin]
    depends_on:
      db: { condition: service_healthy }
    networks: [frontend, backend]
    security_opt: ["no-new-privileges:true"]

  nginx:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: petshop-nginx
    restart: unless-stopped
    user: "${NGINX_UID}:${NGINX_GID}"
    ports: ["80:8080", "443:8443"]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on: [webapp]
    networks: [frontend, monitoring]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: petshop-prometheus
    restart: unless-stopped
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    networks: [monitoring]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: petshop-cadvisor
    restart: unless-stopped
    # NGOẠI LỆ HARDENING: cAdvisor privileged để đọc metrics trên host Docker.
    privileged: true
    devices: ["/dev/kmsg"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [monitoring]

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3
    container_name: petshop-nginx-exporter
    restart: unless-stopped
    command: ["--nginx.scrape-uri=http://nginx:8081/stub_status"]
    depends_on: [nginx]
    networks: [monitoring]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: petshop-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${MONITOR_DB_USER}:${MONITOR_DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable
    depends_on:
      db: { condition: service_healthy }
    networks: [backend, monitoring]

  grafana:
    image: grafana/grafana:11.2.0
    container_name: petshop-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - grafanadata:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus, loki]
    networks: [monitoring, frontend]

  loki:
    image: grafana/loki:3.2.0
    container_name: petshop-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - lokidata:/loki
    networks: [monitoring]

  promtail:
    image: grafana/promtail:3.2.0
    container_name: petshop-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      # Cảnh báo: :ro cho socket không giới hạn các thao tác Docker API.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]
    networks: [monitoring]

networks:
  frontend:            # mạng tiếp xúc với người dùng
  backend:             # mạng chứa CSDL, cô lập hoàn toàn khỏi bên ngoài
    internal: true
  monitoring:          # mạng giám sát

volumes:
  pgdata:
  pgadmin:
  promdata:
  grafanadata:
  lokidata:
